name: Build K rank WebP badges
on:
  push:
    paths:
      - 'tools/generate_point_rank_badges.py'
      - '.github/workflows/point-badges.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-badges:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Render K badges and verify real WebP
        run: |
          set -euo pipefail
          python tools/generate_point_rank_badges.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          targets=list(Path('assets/img').glob('point-tier-*.webp'))
          assert len(targets)==6, targets
          for p in targets:
              with Image.open(p) as im:
                  assert im.format=='WEBP'
                  assert im.mode=='RGBA'
                  assert im.size==(192,192)
              assert 500 < p.stat().st_size < 70000, p
          print('PASS: 6 transparent WebP K membership crests')
          PY
      - name: Commit assets directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/point-tier-dong.webp assets/img/point-tier-bac.webp assets/img/point-tier-vang.webp assets/img/point-tier-kim-cuong.webp assets/img/point-tier-cao-cap.webp assets/img/point-tier-huyen-thoai.webp
          if git diff --cached --quiet; then echo 'Badges unchanged'; exit 0; fi
          git commit -m 'assets(points): generate six fantasy WEBP membership badges'
          git push origin HEAD:main
