name: Security regression checks

on:
  push:
    paths:
      - 'app/admin/**'
      - 'app/api/**'
      - 'app/includes/**'
      - 'app/topup/**'
      - 'tests/admin_security_smoke.php'
      - 'tests/admin_csrf_smoke.php'
      - 'tests/downloads_smoke.php'
      - 'app/pages/game-download.php'
      - 'config/routes.php'
      - '.htaccess'
      - '.github/workflows/security-checks.yml'
  pull_request:
    paths:
      - 'app/admin/**'
      - 'app/api/**'
      - 'app/includes/**'
      - 'app/topup/**'
      - 'tests/admin_security_smoke.php'
      - 'tests/admin_csrf_smoke.php'
      - 'tests/downloads_smoke.php'
      - 'app/pages/game-download.php'
      - 'config/routes.php'
      - '.htaccess'
      - '.github/workflows/security-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Lint PHP source
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
      - name: Admin MFA and rate limit regression tests
        run: php tests/admin_security_smoke.php
      - name: Admin session and CSRF regression tests
        run: php tests/admin_csrf_smoke.php
      - name: Game download security and toggles smoke tests
        run: php tests/downloads_smoke.php
      - name: Recharge conversion smoke tests
        run: php tests/topup_smoke.php
      - name: Guard public checkout of secret files
        shell: bash
        run: |
          set -euo pipefail
          test ! -f config.register.local.php
          test ! -f .env
          test -f storage/.htaccess
          test -f app/includes/.htaccess
          test -f database/.htaccess
          if git ls-files | grep -Ei '(^|/)(\.env|kpah\.sql|database[-_]?dump|.*\.(pem|p12|pfx))$'; then
            echo 'Secret/dump-like artifact tracked in git'
            exit 1
          fi
