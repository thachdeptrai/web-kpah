name: Topup PHP quality checks
on:
  push:
    paths:
      - 'app/topup/**'
      - 'app/includes/topup_core.php'
      - 'tests/topup_smoke.php'
      - 'tests/security_smoke.php'
      - 'app/includes/admin_security.php'
      - '.htaccess'
      - '.gitignore'
      - 'assets/css/topup.css'
      - 'assets/js/topup-forms.js'
      - '.github/workflows/topup-lint.yml'
  pull_request:
    paths:
      - 'app/topup/**'
      - 'app/includes/topup_core.php'
      - 'tests/topup_smoke.php'
      - 'tests/security_smoke.php'
      - 'app/includes/admin_security.php'
      - '.htaccess'
      - '.gitignore'
      - 'assets/css/topup.css'
      - 'assets/js/topup-forms.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Lint payment module
        shell: bash
        run: |
          set -euo pipefail
          php -l app/includes/topup_core.php
          find app/topup -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/topup_smoke.php
          php -l tests/security_smoke.php
          php -l app/includes/admin_security.php
      - name: Test topup conversions and idempotency status labels
        run: php tests/topup_smoke.php
      - name: Verify admin guard, TOTP and dump protection
        run: php tests/security_smoke.php
      - name: Reject SQL migrations in payment module
        shell: bash
        run: |
          set -euo pipefail
          if find app/topup -type f \( -name '*.sql' -o -name '*.sqlite' \) | grep -q .; then
            echo 'Payment module must not add SQL files.'
            exit 1
          fi
