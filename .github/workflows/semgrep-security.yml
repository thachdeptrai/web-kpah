name: Semgrep focused security gate

on:
  push:
    branches: [main]
    paths:
      - 'app/**/*.php'
      - 'config/**/*.php'
      - 'index.php'
      - '.semgrep/**'
      - '.github/workflows/semgrep-security.yml'
  pull_request:
    paths:
      - 'app/**/*.php'
      - 'config/**/*.php'
      - 'index.php'
      - '.semgrep/**'
      - '.github/workflows/semgrep-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Semgrep CLI
        run: python -m pip install --disable-pip-version-check 'semgrep==1.181.0'
      - name: Focused high-confidence blocking rules
        run: semgrep scan --metrics off --error --config .semgrep/security.yml app config index.php
      - name: Additional PHP ruleset (advisory only)
        id: advisory
        continue-on-error: true
        run: semgrep scan --metrics off --config p/php --json --output semgrep-php-advisory.json app config index.php
      - name: Summarize advisory findings without printing source data
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('semgrep-php-advisory.json')
          if not p.exists():
              print('Semgrep advisory report missing (scan may have failed)')
          else:
              data=json.loads(p.read_text(encoding='utf-8'))
              issues=data.get('results', [])
              print('Semgrep advisory findings:', len(issues))
              for rule, count in Counter(r.get('check_id','') for r in issues).most_common():
                  print('Rule:', rule, 'Count:', count)
              for rule, count in Counter(r.get('check_id','') for r in issues).most_common():
                  print('First locations for', rule)
                  for r in [x for x in issues if x.get('check_id','')==rule][:8]:
                      start=r.get('start',{})
                      print('Finding:',r.get('extra',{}).get('severity',''),
                            r.get('check_id',''),r.get('path',''),
                            'line',start.get('line', '?'))
          PY
      - name: Upload advisory scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-php-advisory
          path: semgrep-php-advisory.json
          if-no-files-found: ignore
          retention-days: 14
