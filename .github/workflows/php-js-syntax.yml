name: PHP and JS syntax checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.0 (XAMPP compatibility)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: none
          coverage: none
      - name: PHP lint all website and CLI sources
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Node.js JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/downloads_upload_ui.test.js
          node tests/game_accounts_bulk_ui.test.js
          node tests/giftcode_picker_ui.test.js
