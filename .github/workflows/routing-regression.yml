name: Routes and account regression
on:
  push:
    paths: ['app/**', 'config/**', 'index.php', '.htaccess', 'tests/**', '.github/workflows/routing-regression.yml']
  pull_request:
    paths: ['app/**', 'config/**', 'index.php', '.htaccess', 'tests/**', '.github/workflows/routing-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.0', server: cli}
          - {php: '8.3', server: cli}
          - {php: '8.3', server: apache}
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: kpah_route_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      KPAH_DB_HOST: 127.0.0.1
      KPAH_DB_PORT: '3306'
      KPAH_DB_NAME: kpah_route_test
      KPAH_DB_USER: root
      KPAH_DB_PASS: fixture-only-password
      KPAH_ADMIN_REQUIRE_TOTP: '0'
      KPAH_TEST_URL: http://127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_mysql, mbstring, gd
          coverage: none
      - name: Lint and existing regression suites
        run: |
          set -euo pipefail
          find app config tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          for test in tests/*_smoke.php; do php "$test"; done
      - name: Load schema-only fixture and validate game queries
        run: php tests/seed_fixture.php
      - name: Game account ban and character moderation integration
        run: php tests/game_account_moderation_integration.php
      - name: Bulk game unban integration (fixture DB only)
        run: php tests/game_bulk_unban_integration.php
      - name: Farmer monitoring DB integration
        run: php tests/farmer_monitor_integration.php
      - name: Verified bank farmer bonus MyISAM integration (fixture DB only)
        run: php tests/bank_farmer_integration.php
      - name: Start PHP CLI server
        if: matrix.server == 'cli'
        run: php -S 127.0.0.1:8089 -t . tests/dev_router.php > /tmp/kpah-http.log 2>&1 &
      - name: Start Apache with actual htaccess
        if: matrix.server == 'apache'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-mysql php8.3-mbstring php8.3-gd
          sudo a2dismod mpm_event || true
          sudo a2enmod mpm_prefork rewrite php8.3
          sudo chmod o+x /home/runner /home/runner/work
          chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo chown -R www-data:www-data storage
          sudo tee /etc/apache2/ports.conf <<EOF
          Listen 127.0.0.1:8089
          EOF
          sudo tee /etc/apache2/sites-available/000-default.conf <<EOF
          <VirtualHost 127.0.0.1:8089>
            DocumentRoot "$GITHUB_WORKSPACE"
            SetEnv KPAH_DB_HOST 127.0.0.1
            SetEnv KPAH_DB_PORT 3306
            SetEnv KPAH_DB_NAME kpah_route_test
            SetEnv KPAH_DB_USER root
            SetEnv KPAH_DB_PASS fixture-only-password
            SetEnv KPAH_ADMIN_REQUIRE_TOTP 0
            <Directory "$GITHUB_WORKSPACE">
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          EOF
          sudo apache2ctl configtest
          sudo systemctl restart apache2
      - name: HTTP regression
        env:
          KPAH_TEST_SESSION_FIXTURE: ${{ matrix.server == 'cli' && '1' || '0' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --silent --fail "$KPAH_TEST_URL/dang-nhap" > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http_regression.py
      - name: Browser responsive overlap regression
        if: matrix.php == '8.3' && matrix.server == 'cli'
        run: |
          python3 -m pip install --user websocket-client
          python3 tests/home_layout_visual.py
      - name: Upload homepage viewport screenshots
        if: always() && matrix.php == '8.3' && matrix.server == 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-layout-viewport-screenshots
          path: artifacts/home-layout/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Server error log on failure
        if: failure()
        run: |
          cat /tmp/kpah-http.log 2>/dev/null || true
          sudo tail -60 /var/log/apache2/error.log 2>/dev/null || true
