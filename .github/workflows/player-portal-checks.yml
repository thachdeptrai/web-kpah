name: Player portal and leaderboard checks

on:
  push:
    paths:
      - 'app/pages/home.php'
      - 'app/pages/profile.php'
      - 'app/pages/characters.php'
      - 'app/pages/rankings.php'
      - 'app/includes/player_portal.php'
      - 'app/includes/user_center.php'
      - 'app/pages/my-giftcodes.php'
      - 'app/pages/notifications.php'
      - 'app/pages/order-tracker.php'
      - 'app/pages/security-history.php'
      - 'assets/js/toast.js'
      - 'assets/css/user-center.css'
      - 'tests/user_center_smoke.php'
      - 'app/includes/character_inventory.php'
      - 'app/pages/character-detail.php'
      - 'tests/character_inventory_smoke.php'
      - 'assets/css/character-inventory.css'
      - 'app/includes/rankings.php'
      - 'assets/css/player-portal.css'
      - 'assets/img/rank-*.webp'
      - 'assets/img/kpah-player-icon-atlas.png'
      - 'assets/css/player-art-icons.css'
      - 'tests/rankings_smoke.php'
      - '.github/workflows/player-portal-checks.yml'
  pull_request:
    paths:
      - 'app/pages/home.php'
      - 'app/pages/profile.php'
      - 'app/pages/characters.php'
      - 'app/pages/rankings.php'
      - 'app/includes/player_portal.php'
      - 'app/includes/user_center.php'
      - 'app/pages/my-giftcodes.php'
      - 'app/pages/notifications.php'
      - 'app/pages/order-tracker.php'
      - 'app/pages/security-history.php'
      - 'assets/js/toast.js'
      - 'assets/css/user-center.css'
      - 'tests/user_center_smoke.php'
      - 'app/includes/character_inventory.php'
      - 'app/pages/character-detail.php'
      - 'tests/character_inventory_smoke.php'
      - 'assets/css/character-inventory.css'
      - 'app/includes/rankings.php'
      - 'assets/css/player-portal.css'
      - 'assets/img/rank-*.webp'
      - 'tests/rankings_smoke.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Lint player pages
        shell: bash
        run: |
          set -euo pipefail
          for path in app/pages/home.php app/pages/profile.php app/pages/characters.php app/pages/rankings.php app/includes/player_portal.php app/includes/rankings.php tests/rankings_smoke.php; do
            php -l "$path"
          done
      - name: Test static leaderboard queries and category whitelist
        run: php tests/rankings_smoke.php
      - name: Character inventory source and ownership smoke tests
        run: php tests/character_inventory_smoke.php
      - name: User center query and scope regression
        run: php tests/user_center_smoke.php
      - name: Validate WebP podium art and custom PNG icons
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          for path in ('assets/img/rank-guardian.webp','assets/img/rank-sorcerer.webp','assets/img/rank-archer.webp'):
              data=open(path,'rb').read()
              assert len(data)>100 and data[:4]==b'RIFF' and data[8:12]==b'WEBP', path
              print(path,'valid WebP artwork')
          path='assets/img/kpah-player-icon-atlas.png'
          data=open(path,'rb').read()
          assert data[:8]==b'\\x89PNG\\r\\n\\x1a\\n', 'custom icon atlas is not PNG'
          width,height=struct.unpack('>II',data[16:24])
          assert (width,height)==(256,192), (width,height)
          print(path,'valid original PNG icon atlas')
          PY
