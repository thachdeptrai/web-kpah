<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">NGHIỆN KPAH — Hành trình tuổi thơ</title>
<desc id="desc">Logo phiêu lưu fantasy với chữ vàng nổi bật, bảng hiệu gỗ, mái đình và mây xanh.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#fffbd0"/><stop offset=".18" stop-color="#ffe962"/><stop offset=".52" stop-color="#ffb51e"/><stop offset=".78" stop-color="#ef7708"/><stop offset="1" stop-color="#b64606"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#a95420"/><stop offset=".42" stop-color="#713318"/><stop offset="1" stop-color="#3c1b18"/>
  </linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6de6ff"/><stop offset=".52" stop-color="#27a9e8"/><stop offset="1" stop-color="#3470ce"/>
  </linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#c4f36c"/><stop offset=".55" stop-color="#4fbe56"/><stop offset="1" stop-color="#187254"/>
  </linearGradient>
  <filter id="shadow" x="-15%" y="-30%" width="130%" height="170%">
    <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#23385c" flood-opacity=".38"/>
  </filter>
</defs>
<g filter="url(#shadow)" stroke-linejoin="round">
